<!doctype html>
<html lang="ka">
<head>
  <meta charset="utf-8">
  <title>Arena.ge — ტურნირების პლატფორმა</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Arena.ge — საქართველოს საჭადრაკო ტურნირების პლატფორმა. აღმოაჩინე ტურნირები, დარეგისტრირდი და მართე ღონისძიებები.">
  <meta name="theme-color" content="#0f5c47">
  <meta property="og:site_name" content="Arena.ge">
  <meta property="og:type" content="website">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+Georgian:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    (function () {
      try {
        var mode = localStorage.getItem('arena.theme') || 'system';
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (mode === 'dark' || (mode === 'system' && prefersDark)) {
          document.documentElement.classList.add('app-dark');
          document.documentElement.style.colorScheme = 'dark';
        }
        var lang = localStorage.getItem('arena.language');
        if (lang) {
          document.documentElement.lang = lang;
        }
      } catch (error) {}
    })();
  </script>
</head>
<body>
  <app-root></app-root>
  <noscript>Arena.ge requires JavaScript for tournament registration and management.</noscript>
</body>
</html>
